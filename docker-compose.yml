version: "3.9"

services:
  postgres:
    image: postgres:16
    container_name: romai-pg
    environment:
      POSTGRES_USER: rxuser
      POSTGRES_PASSWORD: devpass
      POSTGRES_DB: rxserver
    ports:
      - "5432:5432"
    volumes:
      - romai-pg-data:/var/lib/postgresql/data

volumes:
  romai-pg-data:
